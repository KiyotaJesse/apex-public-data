function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function state(title,body){
  document.getElementById("app").innerHTML=
    '<div class="state"><b>'+esc(title)+'</b>'+esc(body)+'</div>';
}
function dueTxt(it){
  var d=it.due_in;
  if(d<0) return "逾期 "+(-d)+" 天";
  if(d===0) return "今天到期";
  if(d>900) return "沒設到期日";
  return d+" 天後到期";
}
function item(it){
  return '<li'+(it.late?' class="late"':'')+'><div class="t">'+esc(it.title)+'</div>'+
         '<div class="m"><b>'+esc(dueTxt(it))+'</b> · '+esc(it.due)+' · '+esc(it.id)+
         '<br>'+esc(it.howto)+'</div></li>';
}
function render(b,how){
  if(!b||!b.verdict){state("沒有資料","apex_brief.json 是空的或格式不對, 跑 build_brief.py 重產");return;}
  var v=b.verdict, ns=b.numbers||[], js=b.jesse||[], au=b.auto||{};
  // 資料時間同時放頂欄(首屏看得到)與頁腳; 過期標紅 -- 這頁是靜態的, 08:10 才更新
  var fc=au.forecast||null;
  var h='<div class="top"><span>APEX 戰情 10 秒版</span>'+
        (fc?'<span>持牌 '+esc(fc.licensed)+'</span>':'')+
        '<span'+(b.stale?' class="stale"':'')+
        '>資料 '+esc((b.data_ts||"?").slice(5,16))+(b.stale?' 已過期':'')+'</span></div>';
  h+='<div class="cell"><span class="lbl">今天要不要理它</span><div class="verdict">'+
     '<div class="word '+esc(v.tone)+'">'+esc(v.word)+'</div><div class="why">'+esc(v.why)+
     (v.fired&&v.fired.length>1?'<span class="more">另外 '+(v.fired.length-1)+' 條: '+esc(v.fired.slice(1,3).join(" / "))+'</span>':'')+
     '</div></div></div>';
  h+='<div class="cell"><span class="lbl">三個數字</span><div class="nums">';
  for(var i=0;i<ns.length;i++){var n=ns[i];
    h+='<div class="num '+esc(n.tone)+'"><div class="k">'+esc(n.k)+'</div>'+
       '<div class="v">'+esc(n.v)+'<span class="u"> '+esc(n.unit)+'</span></div>'+
       '<div class="s">'+esc(n.sub)+'</div></div>';}
  h+='</div></div>';
  h+='<div class="cell"><span class="lbl">你要做的</span>';
  if(!js.length){h+='<div class="none">你不用做任何事</div>';}
  else{
    // 手機一屏優先: 最急的兩件全尺寸, 其餘收進摺疊(展開後同字級)
    var TOP=2;
    h+='<ul class="todo">'+js.slice(0,TOP).map(item).join("")+'</ul>';
    if(js.length>TOP){
      h+='<details class="rest"><summary>還有 '+(js.length-TOP)+' 件（最近一件 '+
         esc(js[TOP].due)+'）</summary><ul class="todo">'+
         js.slice(TOP).map(item).join("")+'</ul></details>';}
  }
  h+='</div>';
  h+='<div class="cell"><span class="lbl">系統自己會做的</span><div class="auto">'+esc(au.line||"")+'</div></div>';
  // WO-48 格 5 北極星: 三條進度條(M1/M2/M3)常駐, 風險儀一行, 最短路徑收進摺疊
  var g=b.north_star;
  if(g&&g.milestones&&g.milestones.length){
    h+='<div class="cell"><span class="lbl">北極星'+(g.stale?'（'+g.age_h+' 小時沒更新）':'')+
       '</span>';
    h+='<div class="ns-risk '+esc(g.risk_light)+'"><span class="dot"></span>失敗風險儀：'+
       esc(g.risk_why||'—')+'</div>';
    h+='<div class="ns">';
    for(var k=0;k<g.milestones.length;k++){var m=g.milestones[k];
      var w=Math.max(0,Math.min(100,Number(m.pct)||0));
      h+='<div class="bar '+esc(m.status)+'"><div class="bh"><b>'+esc(m.id)+' '+esc(m.name)+'</b>'+
         '<span class="dl">'+esc(m.est)+'　'+esc(m.delta)+'</span></div>'+
         '<div class="track"><div class="fill" style="width:'+w+'%"></div></div>'+
         '<div class="sub">'+esc(m.note)+'（'+w+'%／Jesse '+esc(m.jesse)+'）</div></div>';}
    h+='</div>';
    h+='<details class="rest"><summary>本週最短路徑（'+g.milestones.length+' 條）</summary>'+
       '<ul class="ns-path">';
    for(var k2=0;k2<g.milestones.length;k2++){
      h+='<li>'+esc(g.milestones[k2].path)+'</li>';}
    if(g.risk_path){h+='<li>'+esc(g.risk_path)+'</li>';}
    h+='</ul></details></div>';
  }
  var st=b.stale?" stale":"";
  h+='<div class="foot'+st+'">資料時間 '+esc(b.data_ts||"?")+
     (b.data_age_h!=null?"（"+b.data_age_h+" 小時前）":"")+
     ' · 本頁靜態, 每日 08:10 隨蟻丘更新 · 產生 '+esc((b.ts||"").replace("T"," "))+
     ' · 來源 '+esc(how);
  if(b.caveats&&b.caveats.length){h+='<div class="cav">※ '+esc(b.caveats.join(" ／ "))+'</div>';}
  h+='</div>';
  document.getElementById("app").innerHTML=h;
  if(/[?&]debug=1/.test(location.search)){
    var r=document.getElementById("raw");r.style.display="block";
    r.textContent=JSON.stringify(b,null,1);}
}
(function(){
  var done=false;
  function fallback(why){
    if(done)return; done=true;
    if(EMBED&&EMBED.verdict){render(EMBED,"內嵌快照("+why+")");}

  }

  // json 檔名跟著頁面檔名走(apex_brief.html -> apex_brief.json; 公開推成 apex_colony666_brief.html 就找 apex_colony666_brief.json)
  var jn="apex_brief.json";
  try{
    jn=(location.pathname.split("/").pop()||"apex_brief.html").replace(/\.html?$/i,"")+".json";
    if(!/\.json$/.test(jn)||jn===".json") jn="apex_brief.json";
    fetch(jn,{cache:"no-store"}).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status); return r.json();
    }).then(function(j){
      if(done)return; done=true; clearTimeout(t); render(j,jn);
    })["catch"](function(e){clearTimeout(t);fallback(String(e.message||e));});
  }catch(e){clearTimeout(t);fallback("瀏覽器不支援 fetch");}
})();
